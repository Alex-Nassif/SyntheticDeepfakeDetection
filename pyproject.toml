[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfake-detector"
version = "0.1.0"
description = "Image-based deepfake detection using GenD and PyTorch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "transformers==4.57.6",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "Pillow>=10.0",
    "streamlit>=1.35",
    "datasets",
]

[tool.setuptools]
py-modules = ["main", "model_setup", "data_processor", "evaluation"]
